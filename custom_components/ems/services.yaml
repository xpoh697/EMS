set_manual_override:
  name: Set manual override
  description: Sets a manual operating mode/override for a specific date and hour slot.
  fields:
    date:
      name: Date
      description: Target date in YYYY-MM-DD format (defaults to current date).
      required: false
      example: "2026-05-20"
      selector:
        text:
    hour:
      name: Hour
      description: Target hour slot (0 to 23).
      required: true
      example: 14
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box
    action:
      name: Action
      description: The manual action to schedule for this slot.
      required: true
      example: self_consume
      selector:
        select:
          options:
            - label: Grid charge
              value: grid_charge
            - label: Discharge
              value: discharge
            - label: Self consume
              value: self_consume
            - label: Idle
              value: idle
    target_soc:
      name: Target SOC
      description: Target State of Charge (%) for grid_charge or discharge actions. If omitted or exceeds battery power limits, it will be auto-calculated.
      required: false
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: slider

clear_manual_override:
  name: Clear manual override
  description: Clears a manual operating mode/override for a specific date and hour slot.
  fields:
    date:
      name: Date
      description: Target date in YYYY-MM-DD format (defaults to current date).
      required: false
      example: "2026-05-20"
      selector:
        text:
    hour:
      name: Hour
      description: Target hour slot (0 to 23).
      required: true
      example: 14
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box

clear_all_overrides:
  name: Clear all overrides
  description: Clears all manual operating mode/override entries from storage.

start_calibration:
  name: Start Boiler Calibration
  description: Starts one of the manually triggered heating calibration phases to determine efficiency.
  fields:
    phase:
      name: Calibration Phase
      description: The active calibration phase to start.
      required: true
      example: gas_only
      selector:
        select:
          options:
            - label: Gas heating only
              value: gas_only
            - label: Gas heating with circulation pump
              value: gas_with_pump
            - label: Electric heating only
              value: elec_only
            - label: Electric heating with circulation pump
              value: elec_with_pump
    heating_duration_minutes:
      name: Heating Duration
      description: "For pump phases: Duration of the heating phase in minutes (default 5)."
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    target_temperature_delta:
      name: Target Temperature Delta
      description: "For non-pump phases: Temperature increase target in °C (default 12.0)."
      required: false
      example: 12.0
      selector:
        number:
          min: 1.0
          max: 50.0
          step: 0.5
          mode: box
    stabilization_minutes:
      name: Stabilization Duration
      description: "Duration to wait for temperature stabilization after heating in minutes (default 10)."
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box

start_manual_heating:
  name: Start Manual Heating
  description: Starts a manual heating cycle with the selected mode and target temperature setpoint.
  fields:
    mode:
      name: Heating Mode
      description: The heating mode to run.
      required: true
      example: ELEC
      selector:
        select:
          options:
            - label: GAS - gas only
              value: GAS
            - label: GAS_PUMP - Gas + pump
              value: GAS_PUMP
            - label: ELEC - Electro only
              value: ELEC
            - label: Elec_pump - eclectro + pump
              value: ELEC_PUMP
            - label: PUMP_ONLY - Pump only (mixing)
              value: PUMP_ONLY
    setpoint:
      name: Target Temperature Setpoint
      description: Target temperature to heat the boiler up to.
      required: true
      example: 65.0
      selector:
        number:
          min: 20.0
          max: 85.0
          step: 0.5
          mode: box

stop_manual_heating:
  name: Stop Manual Heating
  description: Stops the active manual heating cycle and shuts down heating elements.
